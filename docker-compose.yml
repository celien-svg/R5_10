# docker-compose.yml — PixelHub
# Les ports côté hôte sont décalés par défaut pour éviter tout conflit
# avec un PostgreSQL / MySQL / Redis déjà installé sur la machine.
# Ils sont surchargeables via le fichier .env.
#
#   docker compose up -d                        → les 4 moteurs (déroulé du TP : puis `dotnet run`)
#   docker compose --profile app up -d --build  → les 4 moteurs + l'API conteneurisée (+ jeux de données)

services:

  # ---------------------------------------------------------------
  # PostgreSQL — données transactionnelles (joueurs, monnaie, achats)
  # Utilisé dès la séance 1.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: pixelhub-postgres
    environment:
      POSTGRES_USER: pixelhub
      POSTGRES_PASSWORD: pixelhub_dev
      POSTGRES_DB: pixelhub
    ports:
      - "${PG_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # MongoDB — catalogue de jeux (séance 2)
  # ---------------------------------------------------------------
  mongo:
    image: mongo:8
    container_name: pixelhub-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: pixelhub
      MONGO_INITDB_ROOT_PASSWORD: pixelhub_dev
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "pixelhub", "-p", "pixelhub_dev",
             "--authenticationDatabase", "admin", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------
  # Redis — classements, matchmaking, cache (séance 3)
  # Pas de mot de passe : environnement de développement local.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pixelhub-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------
  # Neo4j — graphe social et recommandation (séance 4)
  # 7474 = interface web (Neo4j Browser), 7687 = protocole Bolt (driver)
  # ---------------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: pixelhub-neo4j
    environment:
      # Format obligatoire utilisateur/motdepasse, 8 caractères minimum.
      NEO4J_AUTH: neo4j/pixelhub_dev
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Neo4j met 20 à 40 s à démarrer : on attend qu'il réponde vraiment en Bolt.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p pixelhub_dev 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # ---------------------------------------------------------------
  # L'API PixelHub elle-même, conteneurisée (profil « app »).
  # Elle tourne DANS le réseau Docker : elle joint les moteurs par
  # leur nom de service et leur port interne (postgres:5432…), pas
  # par localhost:15432. D'où les chaînes surchargées ci-dessous.
  # ---------------------------------------------------------------
  api:
    profiles: ["app"]
    build: .
    image: pixelhub-api:seance1
    container_name: pixelhub-api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pixelhub;Username=pixelhub;Password=pixelhub_dev"
    ports:
      - "${API_PORT:-5199}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
